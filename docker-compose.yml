services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/data/prod.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 8h
      UPLOAD_DIR: /data/uploads
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      CORS_ORIGIN: http://localhost:8080
      SEED_ON_START: ${SEED_ON_START:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      EMAIL_ALLOWED_DOMAINS: ${EMAIL_ALLOWED_DOMAINS:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
    volumes:
      - db-data:/data
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/v1/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  db-data:
